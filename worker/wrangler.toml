name = "bookyourspa"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "bookyourspa"
database_id = "00000000-0000-0000-0000-000000000000"

[assets]
directory = "../web/out"
binding = "ASSETS"
run_worker_first = true
