name = "bookyourspa"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# APP_ORIGIN is derived from the request host; email links default to https://bookyourspa.net
[[d1_databases]]
binding = "DB"
database_name = "bookyourspa"
# Run `npx wrangler d1 create bookyourspa` (from worker/) and paste the real database_id below:
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[assets]
directory = "../deploy/public"
binding = "ASSETS"
run_worker_first = true
